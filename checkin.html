<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Check-in - VOLTRIX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: #F9FAFB; color: #111827; padding: 15px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
  .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
  
  .header { position: absolute; top: 20px; left: 20px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5E7EB; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #2563EB; cursor: pointer; }

  .checkin-card { background: #FFFFFF; border-radius: 24px; padding: 32px 24px; border: 1px solid #E5E7EB; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
  .title { font-size: 22px; font-weight: 800; color: #111827; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #6B7280; font-weight: 500; margin-bottom: 30px; }

  /* ⭐ THE GIFT BOX ANIMATION ⭐ */
  .box-container { margin: 20px auto 40px; width: 150px; height: 150px; display: flex; justify-content: center; align-items: center; position: relative; }
  .gift-box { font-size: 100px; line-height: 1; cursor: pointer; transition: 0.2s; user-select: none; }
  
  /* Shake Animation */
  @keyframes shake {
    0% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(-10deg) scale(1.1); }
    40% { transform: rotate(10deg) scale(1.1); }
    60% { transform: rotate(-10deg) scale(1.1); }
    80% { transform: rotate(10deg) scale(1.1); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .shaking { animation: shake 0.5s infinite; }

  .btn-checkin { width: 100%; padding: 18px; background: #2563EB; color: #FFFFFF; font-size: 16px; font-weight: 800; border-radius: 16px; border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(37,99,235,0.3); transition: 0.2s; }
  .btn-checkin:active { transform: scale(0.98); }
  .btn-checkin:disabled { background: #9CA3AF; cursor: not-allowed; box-shadow: none; }
  
  .status-text { font-size: 13px; font-weight: 700; color: #16A34A; margin-top: 16px; display: none; }

  /* ⭐ POPUP ⭐ */
  .popup-overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; opacity: 0; visibility: hidden; transition: 0.3s; }
  .popup-overlay.show { opacity: 1; visibility: visible; }
  .popup-card { max-width: 320px; background: #FFFFFF; border-radius: 24px; padding: 32px 24px; width: 100%; text-align: center; transform: scale(0.8); transition: 0.3s; }
  .popup-overlay.show .popup-card { transform: scale(1); }
  
  .popup-icon { font-size: 60px; margin-bottom: 16px; animation: bounce 1s infinite alternate; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  .popup-title { font-size: 24px; font-weight: 900; color: #16A34A; margin-bottom: 6px; }
  .popup-sub { font-size: 14px; color: #6B7280; font-weight: 500; margin-bottom: 24px; }
  .popup-amount { font-size: 40px; font-weight: 900; color: #F59E0B; margin-bottom: 24px; }
  .popup-btn { width: 100%; padding: 14px; background: #16A34A; color: #FFFFFF; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
  </div>

  <div class="checkin-card">
    <div class="title">Daily Check-in</div>
    <div class="subtitle">Tap the box to claim your daily reward!</div>
    
    <div class="box-container" onclick="triggerCheckin()">
      <div class="gift-box" id="giftBox">🎁</div>
    </div>

    <button class="btn-checkin" id="checkinBtn" onclick="triggerCheckin()">Check In Now</button>
    <div class="status-text" id="statusText">✅ You have already checked in today!</div>
  </div>
</div>

<!-- ⭐ SUCCESS POPUP ⭐ -->
<div class="popup-overlay" id="successPopup">
  <div class="popup-card">
    <div class="popup-icon">🪙</div>
    <div class="popup-title">Congratulations!</div>
    <div class="popup-sub">You won your daily check-in reward</div>
    <div class="popup-amount">₦50</div>
    <button class="popup-btn" onclick="closePopup()">Claim Reward</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
var currentUser = null;
var isCheckingIn = false;

function $(id){ return document.getElementById(id); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function init() {
  currentUser = await requireLogin();
  if (!currentUser) return;
  
  // Check if already checked in today
  if (currentUser.lastCheckinDate === todayStr()) {
    $('checkinBtn').disabled = true;
    $('checkinBtn').textContent = 'Already Checked In';
    $('statusText').style.display = 'block';
    $('giftBox').style.opacity = '0.5';
  }
}

async function triggerCheckin() {
  if (isCheckingIn) return;
  if (currentUser.lastCheckinDate === todayStr()) {
    alert("You have already checked in today! Come back tomorrow.");
    return;
  }

  isCheckingIn = true;
  $('checkinBtn').disabled = true;
  $('checkinBtn').textContent = 'Opening...';
  $('giftBox').classList.add('shaking');

  // Simulate opening the box
  setTimeout(async function() {
    $('giftBox').classList.remove('shaking');
    $('giftBox').textContent = '💎'; // Change to diamond after opening
    
    try {
      var freshUser = await dbGetUser(currentUser.userId);
      var newBal = (freshUser.balance || 0) + 50;
      var newEarned = (freshUser.totalEarned || 0) + 50;
      
      // Update the database
      await dbUpdateUser(currentUser.userId, { 
        balance: newBal,
        total_earned: newEarned,
        last_checkin_date: todayStr() 
      });
      
      // Show success popup
      $('successPopup').classList.add('show');
      
      currentUser.lastCheckinDate = todayStr();
      $('statusText').style.display = 'block';
      $('checkinBtn').textContent = 'Already Checked In';

    } catch(e) {
      console.error(e);
      alert("❌ Error processing check-in. Try again.");
      $('checkinBtn').disabled = false;
      $('checkinBtn').textContent = 'Check In Now';
      $('giftBox').textContent = '🎁';
    }
  }, 2000); // 2 seconds of shaking
}

function closePopup() {
  $('successPopup').classList.remove('show');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
