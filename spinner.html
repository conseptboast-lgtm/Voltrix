<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lucky Spin - VOLTRIX</title>
<style>
  :root { --primary: #2563EB; --black: #111827; --gray: #6B7280; --gray-light: #F9FAFB; --border: #E5E7EB; --white: #FFFFFF; --success: #16A34A; --danger: #DC2626; --gold: #F59E0B; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background-color: var(--gray-light); color: var(--black); padding: 15px 15px 80px 15px; min-height: 100vh; display: flex; justify-content: center; }
  .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
  
  .header { display: flex; align-items: center; justify-content: space-between; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--white); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--primary); cursor: pointer; }
  .header-title { font-size: 18px; font-weight: 800; color: var(--black); text-transform: uppercase; }
  .record-btn { background: var(--white); border: 1px solid var(--border); color: var(--primary); padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
  
  .note-box { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 14px; padding: 14px; text-align: center; }
  .note-box p { font-size: 12px; font-weight: 600; color: #B45309; line-height: 1.5; }
  
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 900; color: var(--black); }
  .stat-value span { color: var(--primary); }
  .stat-value.spin-count { color: var(--gold); }
  
  .wheel-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0; position: relative; }
  .wheel-wrapper { position: relative; width: 260px; height: 260px; margin: 0 auto; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#2563EB 0deg 45deg, #FFFFFF 45deg 90deg, #2563EB 90deg 135deg, #FFFFFF 135deg 180deg, #2563EB 180deg 225deg, #FFFFFF 225deg 270deg, #2563EB 270deg 315deg, #FFFFFF 315deg 360deg); border: 8px solid var(--white); box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 0 20px rgba(0,0,0,0.1); transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); transform: rotate(0deg); }
  .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid var(--primary); z-index: 10; }
  .spin-btn-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; background: var(--primary); color: var(--white); border: 4px solid var(--white); font-size: 13px; font-weight: 900; cursor: pointer; z-index: 5; box-shadow: 0 4px 15px rgba(37,99,235,0.4); transition: 0.2s; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
  .spin-btn-center:active { transform: translate(-50%, -50%) scale(0.9); }
  .spin-btn-center:disabled { background: #9CA3AF; cursor: not-allowed; box-shadow: none; }
  
  .popup-overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
  .popup-card { max-width: 340px; background: var(--white); border-radius: 24px; padding: 28px; width: 100%; text-align: center; max-height: 80vh; overflow-y: auto; }
  .popup-icon { font-size: 48px; margin-bottom: 12px; }
  .popup-title { font-size: 18px; font-weight: 900; color: var(--black); margin-bottom: 6px; }
  .popup-text { font-size: 13px; font-weight: 500; color: var(--gray); line-height: 1.5; margin-bottom: 20px; }
  .popup-btn { width: 100%; padding: 14px; background: var(--primary); color: var(--white); border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; }
  
  /* Records List */
  .record-item { display: flex; justify-content: space-between; align-items: center; background: var(--gray-light); border-radius: 12px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
  .record-left { text-align: left; }
  .record-title { font-size: 13px; font-weight: 800; color: var(--black); }
  .record-time { font-size: 10px; color: var(--gray); margin-top: 2px; }
  .record-status { font-size: 11px; font-weight: 800; text-transform: uppercase; }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
    <div class="header-title">Lucky Spin</div>
    <button class="record-btn" onclick="openRecords()">Record</button>
  </div>

  <div class="note-box"><p><b>Note:</b> Spins are given by the Admin. Complete tasks and stay active to receive spins!</p></div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Balance</div><div class="stat-value"><span>₦</span><span id="userBalance">0.00</span></div></div>
    <div class="stat-card"><div class="stat-label">Spins Available</div><div class="stat-value spin-count" id="spinCount">0</div></div>
  </div>

  <div class="wheel-container">
    <div class="wheel-wrapper">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel"></div>
      <button class="spin-btn-center" id="spinBtn" onclick="spinWheel()">SPIN</button>
    </div>
  </div>
</div>

<!-- Result Popup -->
<div id="resultPopup" class="popup-overlay" style="display:none;">
  <div class="popup-card">
    <div class="popup-icon" id="resultIcon">🎉</div>
    <div class="popup-title" id="resultTitle">You Won!</div>
    <div class="popup-text" id="resultText">You have won ₦500.</div>
    <button class="popup-btn" id="resultBtn" onclick="closeResult()">Awesome!</button>
  </div>
</div>

<!-- Records Popup -->
<div id="recordsPopup" class="popup-overlay" style="display:none;">
  <div class="popup-card" style="text-align:left;">
    <div style="font-size:16px;font-weight:900;color:var(--black);margin-bottom:16px;text-align:center;">Spin Records</div>
    <div id="recordsList">
      <div style="text-align:center;padding:20px;color:var(--gray);font-size:13px;">Loading...</div>
    </div>
    <button class="popup-btn" onclick="closeRecords()" style="margin-top:10px;">Close</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  var currentUser = null; var isSpinning = false; var spinsLeft = 0; var currentRotation = 0;
  var PRIZES = [{ label: '₦100', value: 100 }, { label: '₦500', value: 500 }, { label: 'Try Again', value: 0 }, { label: '₦1000', value: 1000 }, { label: '₦200', value: 200 }, { label: '₦5000', value: 5000 }, { label: '₦50', value: 50 }, { label: '₦300', value: 300 }];
  
  function $(id){ return document.getElementById(id); }
  function f(n){ return Number(n || 0).toLocaleString('en-NG', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  
  async function init() { 
    currentUser = await requireLogin(); 
    if (!currentUser) return; 
    
    // Refresh user data fresh from DB
    currentUser = await dbGetUser(currentUser.userId);
    spinsLeft = currentUser.spinCount || 0;
    $('userBalance').textContent = f(currentUser.balance);
    updateSpinUI(); 
  }
  
  function updateSpinUI() { 
    $('spinCount').textContent = spinsLeft; 
    if (spinsLeft <= 0) { 
      $('spinBtn').disabled = true; 
      $('spinBtn').textContent = 'EMPTY'; 
    } else { 
      $('spinBtn').disabled = false; 
      $('spinBtn').textContent = 'SPIN'; 
    } 
  }
  
  function spinWheel() {
    if (isSpinning || spinsLeft <= 0) return;
    isSpinning = true; 
    
    // Deduct spin from DB
    (async function() {
      await dbUpdateUser(currentUser.userId, { spin_count: spinsLeft - 1 });
      spinsLeft--;
      updateSpinUI();
    })();

    $('spinBtn').disabled = true;
    var extraDegrees = Math.floor(Math.random() * 360);
    var totalRotation = currentRotation + (3600 + extraDegrees) + (Math.floor(Math.random() * 5) * 360);
    var randomSegment = Math.floor(Math.random() * 8); var segmentDegree = randomSegment * 45;
    var targetRotation = currentRotation + 1440 + (360 - segmentDegree) - (currentRotation % 360);
    $('wheel').style.transform = 'rotate(' + targetRotation + 'deg)'; currentRotation = targetRotation;
    
    setTimeout(function() { 
      isSpinning = false; 
      var prize = PRIZES[randomSegment]; 
      showResult(prize); 
      updateSpinUI(); 
    }, 4100);
  }
  
  // ⭐ FIXED: Credits money correctly and logs to DB ⭐
  async function showResult(prize) {
    var popup = $('resultPopup'); var icon = $('resultIcon'); var title = $('resultTitle'); var text = $('resultText'); var btn = $('resultBtn');
    
    if (prize.value > 0) { 
      icon.textContent = '🎉'; title.textContent = 'You Won!'; title.style.color = 'var(--success)'; 
      text.innerHTML = 'You have won <b style="color:var(--gold);">' + prize.label + '</b>!'; 
      btn.textContent = 'Awesome!'; btn.className = 'popup-btn'; btn.style.background = 'var(--primary)'; 
      
      // Credit the user securely
      try {
        var freshUser = await dbGetUser(currentUser.userId); // get real balance right now
        var newBal = (freshUser.balance || 0) + prize.value;
        var newEarned = (freshUser.totalEarned || 0) + prize.value;
        
        await dbUpdateUser(currentUser.userId, { 
          balance: newBal,
          total_earned: newEarned,
          total_profit: (freshUser.totalProfit || 0) + prize.value,
          today_profit: (freshUser.todayProfit || 0) + prize.value
        });
        
        currentUser = await dbGetUser(currentUser.userId);
        $('userBalance').textContent = f(currentUser.balance);
        
        // Log the record to DB
        await supabaseClient.from('spin_records').insert([{
          user_id: currentUser.userId, prize: prize.label, amount: prize.value, status: 'success'
        }]);
      } catch(e) { console.error("Error crediting:", e); }
      
    } else { 
      icon.textContent = '😅'; title.textContent = 'Try Again!'; title.style.color = 'var(--danger)'; 
      text.innerHTML = 'You missed this time. Better luck next spin!'; 
      btn.textContent = 'Got it'; btn.className = 'popup-btn'; btn.style.background = 'var(--gray)'; 
      
      // Log the loss to DB
      try {
        await supabaseClient.from('spin_records').insert([{
          user_id: currentUser.userId, prize: 'Try Again', amount: 0, status: 'failed'
        }]);
      } catch(e) {}
    }
    popup.style.display = 'flex';
  }
  
  function closeResult() { $('resultPopup').style.display = 'none'; }
  
  // ⭐ FIXED: Fetches real records from DB ⭐
  async function openRecords() { 
    $('recordsPopup').style.display = 'flex'; 
    var list = $('recordsList');
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray);">Loading...</div>';
    
    try {
      var { data, error } = await supabaseClient.from('spin_records')
        .select('*')
        .eq('user_id', currentUser.userId)
        .order('created_at', { ascending: false })
        .limit(20);
        
      if (error) throw error;
      if (!data || data.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--gray);font-size:13px;">No spin records yet.</div>';
        return;
      }
      
      list.innerHTML = data.map(function(r){
        var isWin = r.amount > 0;
        return '<div class="record-item">' +
          '<div class="record-left">' +
            '<div class="record-title">' + (isWin ? 'Won ' + r.prize : 'Try Again') + '</div>' +
            '<div class="record-time">' + new Date(r.created_at).toLocaleString() + '</div>' +
          '</div>' +
          '<div class="record-status" style="color:' + (isWin ? 'var(--success)' : 'var(--gray)') + ';">' + (isWin ? 'Success' : 'Missed') + '</div>' +
        '</div>';
      }).join('');
      
    } catch(e) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--danger);font-size:13px;">Error loading records.</div>';
    }
  }
  
  function closeRecords() { $('recordsPopup').style.display = 'none'; }
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
</html>
