<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit Records - VOLTRIX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: #F9FAFB; color: #111827; overflow-x: hidden; min-height: 100vh; padding: 15px 15px 80px 15px; display: flex; justify-content: center; }
  .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
  
  /* --- HEADER --- */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; margin-bottom: 10px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5E7EB; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #2563EB; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
  .back-btn:active { transform: scale(0.95); background: #EFF6FF; }
  .header-title { font-size: 18px; font-weight: 800; color: #111827; }
  
  /* --- RECORD LIST --- */
  .record-list { display: flex; flex-direction: column; gap: 12px; }
  .record-item { background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
  .record-top { display: flex; justify-content: space-between; align-items: center; }
  .record-amount { font-size: 18px; font-weight: 900; color: #111827; }
  .record-status-badge { padding: 6px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
  .status-pending { background: #FEF3C7; color: #D97706; }
  .status-approved { background: #DCFCE7; color: #16A34A; }
  .status-failed { background: #FEE2E2; color: #DC2626; }
  .record-bottom { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: #6B7280; border-top: 1px solid #F3F4F6; padding-top: 12px; }
  
  /* --- EMPTY STATE --- */
  .empty-state { text-align: center; padding: 50px 20px; background: #FFFFFF; border: 1px dashed #E5E7EB; border-radius: 20px; margin-top: 20px; }
  .es-icon { font-size: 36px; margin-bottom: 12px; }
  .es-title { font-size: 16px; font-weight: 800; color: #111827; margin-bottom: 4px; }
  .es-sub { font-size: 13px; font-weight: 500; color: #6B7280; }
  
  /* --- FOOTER --- */
  .footer { margin-top: 24px; text-align: center; font-size: 11px; color: #9CA3AF; font-weight: 700; padding-bottom: 20px; }
  .footer .sep { color: #2563EB; margin: 0 6px; font-weight: 900; }
</style>
</head>
<body>
<div class="app-container">
  <div class="header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
    <div class="header-title">Deposit Records</div>
    <div style="width:40px"></div>
  </div>
  <div id="recordList" class="record-list">
    <div class="empty-state"><div class="es-icon">⏳</div><div class="es-title">Loading...</div></div>
  </div>
  <div class="footer">Fast <span class="sep">|</span> Secure</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
function fmtDate(iso){ if (!iso) return '—'; var d = new Date(iso); return d.toLocaleDateString('en-GB', { month: 'short', day: 'numeric' }) + ' • ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }
function render(r){
  var s = (r.status || 'pending').toLowerCase(), cls = 'status-pending', label = 'Pending';
  if (s === 'approved' || s === 'success') { cls = 'status-approved'; label = 'Approved'; }
  if (s === 'failed' || s === 'rejected') { cls = 'status-failed'; label = 'Failed'; }
  return '<div class="record-item">' +
    '<div class="record-top">' +
      '<div class="record-amount">' + formatNaira(r.amount || 0) + '</div>' +
      '<div class="record-status-badge ' + cls + '">' + label + '</div>' +
    '</div>' +
    '<div class="record-bottom">' +
      '<span>' + (r.method || 'Deposit') + '</span>' +
      '<span>' + fmtDate(r.created_at) + '</span>' +
    '</div>' +
  '</div>';
}
(async function(){
  var user = await requireLogin(); if (!user) return;
  var list = document.getElementById('recordList');
  var data = await dbGetDeposits(user.userId);
  if (!data || data.length === 0) { 
    list.innerHTML = '<div class="empty-state"><div class="es-icon">💰</div><div class="es-title">No deposits yet</div><div class="es-sub">Your deposit history will appear here</div></div>'; 
    return; 
  }
  list.innerHTML = data.map(render).join('');
})();
</script>
</body>
</html>
