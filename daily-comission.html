<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VOLTRIX - Daily Commission</title>
  <style>
    :root {
      --light-blue: #3b82f6;
      --black: #1a1a1a;
      --white: #ffffff;
      --bg-light: #f0f7ff;
      --border: #e2e8f0;
      --text-muted: #64748b;
      --success: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-light); color: var(--black); display: flex; justify-content: center; padding: 15px 15px 80px 15px; min-height: 100vh; }
    
    .app-container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }

    /* --- HEADER --- */
    .header { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--white); border: 1px solid var(--border); display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
    .back-btn svg { width: 18px; height: 18px; stroke: var(--black); stroke-width: 2; fill: none; }
    .header-logo { height: 24px; object-fit: contain; }

    /* --- PAGE TITLE --- */
    .page-title { text-align: center; font-size: 16px; font-weight: 900; color: var(--black); padding: 10px 0; text-transform: uppercase; }

    /* --- STATS BOX --- */
    .stats-box { background: var(--white); border-radius: 20px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 8px 25px rgba(59, 130, 246, 0.08); display: flex; flex-direction: column; gap: 12px; }
    .stat-row { display: flex; justify-content: space-between; align-items: center; }
    .stat-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .stat-value { font-size: 16px; font-weight: 900; color: var(--black); }
    .stat-value span { color: var(--light-blue); }

    /* --- TABLE --- */
    .table-container { background: var(--white); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 8px 25px rgba(59, 130, 246, 0.08); }
    .table-header { display: grid; grid-template-columns: 1.5fr 1fr 1fr; background: var(--bg-light); padding: 12px 15px; border-bottom: 1px solid var(--border); }
    .table-header span { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; text-align: center; }
    .table-header span:first-child { text-align: left; }
    
    .table-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr; padding: 14px 15px; border-bottom: 1px solid var(--border); align-items: center; }
    .table-row:last-child { border-bottom: none; }
    .table-row span { font-size: 12px; font-weight: 700; text-align: center; }
    .table-row span:first-child { text-align: left; color: var(--black); }
    .table-row span:nth-child(2) { color: var(--black); }
    .table-row span:last-child { color: var(--success); font-weight: 900; }

    /* --- BOTTOM NAVIGATION --- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: var(--white); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center;
      padding: 10px 0 15px 0; z-index: 100;
      max-width: 420px; left: 50%; transform: translateX(-50%);
      box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
      border-radius: 20px 20px 0 0;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 60px; }
    .nav-icon { width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; }
    .nav-icon svg { width: 22px; height: 22px; stroke: var(--text-muted); stroke-width: 2; fill: none; transition: 0.2s; }
    .nav-label { font-size: 9px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; transition: 0.2s; }
    
    .nav-item.active .nav-icon svg { stroke: var(--light-blue); }
    .nav-item.active .nav-label { color: var(--light-blue); }
  </style>
</head>
<body>

</div>
