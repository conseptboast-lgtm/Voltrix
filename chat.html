<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Customer Service - VOLTRIX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  
  /* 100dvh is crucial for mobile so the keyboard doesn't hide the input */
  body { background-color: #F9FAFB; color: #111827; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* Compact Header */
  .chat-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #FFFFFF; border-bottom: 1px solid #E5E7EB; z-index: 10; }
  .back-icon { width: 36px; height: 36px; border-radius: 10px; background: #F9FAFB; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #2563EB; cursor: pointer; border: none; }
  .back-icon:active { transform: scale(0.95); background: #EFF6FF; }
  .chat-avatar-wrap { position: relative; }
  .chat-avatar { width: 40px; height: 40px; border-radius: 50%; background: #EFF6FF; border: 2px solid #2563EB; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .chat-avatar svg { width: 20px; height: 20px; stroke: #2563EB; stroke-width: 2; fill: none; }
  .chat-avatar::after { content: ''; position: absolute; bottom: 0px; right: 0px; width: 10px; height: 10px; background: #10B981; border: 2px solid #FFFFFF; border-radius: 50%; }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-size: 15px; font-weight: 800; color: #111827; }
  .chat-header-status { font-size: 11px; font-weight: 600; color: #10B981; display: flex; align-items: center; gap: 4px; }

  /* Chat Body */
  .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #F9FAFB; }
  
  /* Compact Bubbles */
  .msg-bubble { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; font-weight: 500; line-height: 1.4; word-wrap: break-word; animation: slideUp 0.2s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg-bubble.user { align-self: flex-end; background: #2563EB; color: #FFFFFF; border-bottom-right-radius: 4px; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }
  .msg-bubble.admin { align-self: flex-start; background: #FFFFFF; color: #374151; border-bottom-left-radius: 4px; border: 1px solid #E5E7EB; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
  .msg-time { font-size: 9px; font-weight: 600; margin-top: 4px; text-align: right; opacity: 0.7; }
  .msg-bubble.admin .msg-time { text-align: left; color: #6B7280; }

  /* Compact Input Area with Safe Area for iPhones */
  .chat-input-area { padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); background: #FFFFFF; border-top: 1px solid #E5E7EB; display: flex; gap: 10px; align-items: center; }
  .chat-input { flex: 1; padding: 12px 16px; background: #F3F4F6; border: 1px solid transparent; border-radius: 24px; font-size: 14px; font-weight: 500; color: #111827; outline: none; transition: 0.2s; }
  .chat-input:focus { border-color: #2563EB; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 2px 8px rgba(37,99,235,0.3); border: none; cursor: pointer; flex-shrink: 0; }
  .send-btn:active { transform: scale(0.9); }
</style>
</head>
<body>

<div class="chat-header">
  <button class="back-icon" onclick="window.location.href='dashboard.html'">←</button>
  <div class="chat-avatar-wrap">
    <div class="chat-avatar">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
    </div>
  </div>
  <div class="chat-header-info">
    <div class="chat-header-name">Customer Service</div>
    <div class="chat-header-status">● Online</div>
  </div>
</div>

<div class="chat-body" id="chatBody">
  <div style="text-align:center;padding:20px;color:#6B7280;font-size:13px;font-weight:600;">Loading messages…</div>
</div>

<div class="chat-input-area">
  <!-- Changed type to text to avoid zoom on mobile -->
  <input type="text" id="chatInput" class="chat-input" placeholder="Type a message..." onkeydown="handleKeyDown(event)" />
  <button class="send-btn" onclick="sendMessage()">➤</button>
</div>

<!-- Load Supabase ONCE inside the body -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
var currentUser = null, pollTimer = null;
var botReplies = [
  "Thank you for reaching out! An agent will be with you shortly.", 
  "We have received your message. Our support team is reviewing it.", 
  "Your message is important to us. Please hold on.", 
  "Hello! Thanks for contacting Voltrix Support. How can we help?", 
  "We are experiencing high volume right now, an agent will reply soon."
];

function $(id){ return document.getElementById(id); }
function fmtTime(iso){ var d = new Date(iso); return d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); }
function esc(s){ return String(s || '').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function handleKeyDown(event) { if (event.key === 'Enter') { event.preventDefault(); sendMessage(); } }

async function loadMessages() {
  if (!currentUser) return;
  var { data, error } = await supabaseClient.from('support_messages').select('*').eq('user_id', currentUser.userId).order('created_at', { ascending: true }).limit(100);
  
  if (error) { console.error(error); return; }
  
  var body = $('chatBody');
  
  if (!data || data.length === 0) { 
    body.innerHTML = '<div style="text-align:center;padding:30px 10px;color:#6B7280;font-size:14px;font-weight:600;">👋 Hi ' + (currentUser.firstName || 'there') + '!<br><span style="font-size:12px;font-weight:500;">How can we help you today?</span></div>'; 
    return; 
  }
  
  var currentCount = body.querySelectorAll('.msg-bubble').length;
  if (currentCount === data.length) return; // Don't re-render if no new messages
  
  var isAtBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  
  body.innerHTML = data.map(function(m){
    var isUser = m.sender === 'user';
    return '<div class="msg-bubble ' + (isUser ? 'user' : 'admin') + '">' + esc(m.message) + '<div class="msg-time">' + fmtTime(m.created_at) + '</div></div>';
  }).join('');
  
  if (isAtBottom) body.scrollTop = body.scrollHeight;
}

async function sendMessage() {
  var input = $('chatInput'); var text = input.value.trim();
  if (!text || !currentUser) return;
  
  input.value = ''; input.disabled = true;
  
  try {
    // 1. Send user message
    await supabaseClient.from('support_messages').insert([{ user_id: currentUser.userId, sender: 'user', message: text, read: false }]);
    await loadMessages();
    
    // 2. Simulate Admin Reply
    setTimeout(async function() {
      var randomReply = botReplies[Math.floor(Math.random() * botReplies.length)];
      await supabaseClient.from('support_messages').insert([{ user_id: currentUser.userId, sender: 'admin', message: randomReply, read: false }]);
      await loadMessages();
    }, 2000);
    
  } catch(e) { 
    console.error(e); 
    alert('❌ Failed to send message. Check connection.'); 
  } finally { 
    input.disabled = false; 
    input.focus(); 
  }
}

async function init() { 
  currentUser = await requireLogin(); 
  if (!currentUser) return; 
  await loadMessages(); 
  pollTimer = setInterval(loadMessages, 3000); 
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
