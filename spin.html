<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lucky Spin - VOLTRIX</title>
<style>
  /* --- DESIGN SYSTEM --- */
  :root {
    --primary: #2563EB;
    --primary-light: #EFF6FF;
    --black: #111827;
    --gray-dark: #374151;
    --gray: #6B7280;
    --gray-light: #F9FAFB;
    --border: #E5E7EB;
    --white: #FFFFFF;
    --success: #16A34A;
    --danger: #DC2626;
    --gold: #F59E0B;
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--gray-light); color: var(--black); padding: 15px 15px 80px 15px; min-height: 100vh; display: flex; justify-content: center; }
  
  .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

  /* --- HEADER --- */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .back-btn { width: 40px; height: 40px; border-radius: 12px; background: var(--white); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--primary); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
  .header-title { font-size: 18px; font-weight: 800; color: var(--black); letter-spacing: 0.5px; text-transform: uppercase; }
  .record-btn { background: var(--white); border: 1px solid var(--border); color: var(--primary); padding: 8px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
  .record-btn:active { background: var(--primary-light); }

  /* --- NOTE BOX --- */
  .note-box { background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 14px; padding: 14px; text-align: center; }
  .note-box p { font-size: 12px; font-weight: 600; color: #B45309; line-height: 1.5; }
  .note-box b { color: #92400E; }

  /* --- STATS ROW --- */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--gray); text-transform: uppercase; margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 900; color: var(--black); }
  .stat-value span { color: var(--primary); }
  .stat-value.spin-count { color: var(--gold); }

  /* --- WHEEL SECTION --- */
  .wheel-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0; position: relative; }
  
  /* The Wheel */
  .wheel-wrapper { position: relative; width: 260px; height: 260px; margin: 0 auto; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#2563EB 0deg 45deg, #FFFFFF 45deg 90deg, #2563EB 90deg 135deg, #FFFFFF 135deg 180deg, #2563EB 180deg 225deg, #FFFFFF 225deg 270deg, #2563EB 270deg 315deg, #FFFFFF 315deg 360deg); border: 8px solid var(--white); box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 0 20px rgba(0,0,0,0.1); transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); transform: rotate(0deg); position: relative; }
  
  /* Wheel Segments Text */
  .wheel-segment { position: absolute; top: 50%; left: 50%; transform-origin: 0 0; font-size: 11px; font-weight: 800; color: var(--white); }
  .wheel-segment.light { color: var(--primary); }
  
  /* Pointer */
  .wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 25px solid var(--primary); z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
  
  /* Center Button */
  .spin-btn-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; background: var(--primary); color: var(--white); border: 4px solid var(--white); font-size: 13px; font-weight: 900; cursor: pointer; z-index: 5; box-shadow: 0 4px 15px rgba(37,99,235,0.4); transition: 0.2s; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
  .spin-btn-center:active { transform: translate(-50%, -50%) scale(0.9); }
  .spin-btn-center:disabled { background: #9CA3AF; cursor: not-allowed; box-shadow: none; }

  /* --- FOOTER TEXT --- */
  .footer-text { text-align: center; font-size: 11px; font-weight: 700; color: var(--gray); margin-top: 10px; }
  .footer-text span { color: var(--primary); margin: 0 4px; }

  /* --- POPUPS --- */
  .popup-overlay { position: fixed; inset: 0; background: rgba(17, 24, 39, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 200; }
  .popup-card { max-width: 340px; background: var(--white); border-radius: 24px; padding: 28px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
  .popup-icon { font-size: 48px; margin-bottom: 12px; }
  .popup-title { font-size: 18px; font-weight: 900; color: var(--black); margin-bottom: 6px; }
  .popup-text { font-size: 13px; font-weight: 500; color: var(--gray); line-height: 1.5; margin-bottom: 20px; }
  .popup-btn { width: 100%; padding: 14px; background: var(--primary); color: var(--white); border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; }
  .popup-btn:active { transform: scale(0.97); }
  .popup-btn.gold { background: var(--gold); }

  /* --- BOTTOM NAVIGATION --- */
  .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--white); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding: 10px 0 15px 0; z-index: 100; max-width: 480px; left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.03); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 60px; }
  .nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .nav-icon svg { width: 22px; height: 22px; stroke: var(--gray); stroke-width: 2; fill: none; transition: 0.2s; }
  .nav-label { font-size: 9px; font-weight: 700; color: var(--gray); text-transform: uppercase; transition: 0.2s; }
  .nav-item.active .nav-icon svg { stroke: var(--primary); }
  .nav-item.active .nav-label { color: var(--primary); }
</style>
</head>
<body>

<div class="app-container">
  
  <!-- HEADER -->
  <div class="header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">←</button>
    <div class="header-title">Lucky Spin</div>
    <button class="record-btn" onclick="openRecords()">Record</button>
  </div>

  <!-- NOTE BOX -->
  <div class="note-box">
    <p><b>Note:</b> Spins are given to some specific users, not casual users.</p>
  </div>

  <!-- STATS ROW -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Balance</div>
      <div class="stat-value"><span>₦</span>0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Spins Available</div>
      <div class="stat-value spin-count" id="spinCount">1</div>
    </div>
  </div>

  <!-- WHEEL SECTION -->
  <div class="wheel-container">
    <div class="wheel-wrapper">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel">
        <!-- Wheel content is purely visual via CSS conic-gradient -->
      </div>
      <button class="spin-btn-center" id="spinBtn" onclick="spinWheel()">SPIN</button>
    </div>
  </div>

  <div class="footer-text">Fast <span>|</span> Secure</div>
</div>

<!-- RESULT POPUP -->
<div id="resultPopup" class="popup-overlay" style="display:none;">
  <div class="popup-card">
    <div class="popup-icon" id="resultIcon">🎉</div>
    <div class="popup-title" id="resultTitle">You Won!</div>
    <div class="popup-text" id="resultText">You have won ₦500. Keep spinning to earn more!</div>
    <button class="popup-btn" id="resultBtn" onclick="closeResult()">Awesome!</button>
  </div>
</div>

<!-- RECORDS POPUP -->
<div id="recordsPopup" class="popup-overlay" style="display:none;">
  <div class="popup-card" style="text-align:left;">
    <div style="font-size:16px;font-weight:900;color:var(--black);margin-bottom:16px;text-align:center;">Spin Records</div>
    <div style="background:var(--gray-light);border-radius:12px;padding:12px;margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;"><span>Won ₦500</span><span style="color:var(--success);">Success</span></div>
      <div style="font-size:10px;color:var(--gray);margin-top:4px;">2 minutes ago</div>
    </div>
    <div style="background:var(--gray-light);border-radius:12px;padding:12px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;"><span>Try Again</span><span style="color:var(--gray);">Missed</span></div>
      <div style="font-size:10px;color:var(--gray);margin-top:4px;">1 hour ago</div>
    </div>
    <button class="popup-btn" onclick="closeRecords()">Close</button>
  </div>
</div>

<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='dashboard.html'"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><span class="nav-label">Home</span></div>
  <div class="nav-item" onclick="window.location.href='team.html'"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><span class="nav-label">Team</span></div>
  <div class="nav-item" onclick="window.location.href='vip.html'"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><span class="nav-label">VIP</span></div>
  <div class="nav-item active"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><span class="nav-label">Tasks</span></div>
  <div class="nav-item" onclick="window.location.href='profile.html'"><div class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><span class="nav-label">Profile</span></div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  var currentUser = null;
  var isSpinning = false;
  var spinsLeft = 1;
  var currentRotation = 0;

  // Placeholder Prizes
  var PRIZES = [
    { label: '₦100', value: 100 },
    { label: '₦500', value: 500 },
    { label: 'Try Again', value: 0 },
    { label: '₦1000', value: 1000 },
    { label: '₦200', value: 200 },
    { label: '₦5000', value: 5000 },
    { label: '₦50', value: 50 },
    { label: '₦300', value: 300 }
  ];

  function $(id){ return document.getElementById(id); }
  function go(url){ window.location.href = url; }

  async function init() {
    // Require login
    currentUser = await requireLogin();
    if (!currentUser) return;
    
    // In a real app, you would fetch the user's spin count from the database.
    // For now, we use a placeholder.
    updateSpinUI();
  }

  function updateSpinUI() {
    $('spinCount').textContent = spinsLeft;
    if (spinsLeft <= 0) {
      $('spinBtn').disabled = true;
      $('spinBtn').textContent = 'EMPTY';
    } else {
      $('spinBtn').disabled = false;
      $('spinBtn').textContent = 'SPIN';
    }
  }

  function spinWheel() {
    if (isSpinning || spinsLeft <= 0) return;
    
    isSpinning = true;
    spinsLeft--;
    updateSpinUI();
    $('spinBtn').disabled = true;

    // Randomize the spin
    // 10 to 20 full rotations + a random segment
    var extraDegrees = Math.floor(Math.random() * 360);
    var totalRotation = currentRotation + (3600 + extraDegrees) + (Math.floor(Math.random() * 5) * 360);
    
    // We want the pointer (at top, 0deg) to land on a random segment.
    // There are 8 segments (45 degrees each). 
    // To make it look natural, we just rotate randomly.
    var randomSegment = Math.floor(Math.random() * 8);
    var segmentDegree = randomSegment * 45; // 0, 45, 90, 135...
    
    // Calculate final rotation so that the pointer lands on the center of the segment
    // Pointer is at 0deg (top). 
    var targetRotation = currentRotation + 1440 + (360 - segmentDegree) - (currentRotation % 360);
    
    // Apply rotation
    $('wheel').style.transform = 'rotate(' + targetRotation + 'deg)';
    currentRotation = targetRotation;

    // Wait for animation to finish (4s)
    setTimeout(function() {
      isSpinning = false;
      var prize = PRIZES[randomSegment];
      showResult(prize);
      updateSpinUI();
    }, 4100);
  }

  function showResult(prize) {
    var popup = $('resultPopup');
    var icon = $('resultIcon');
    var title = $('resultTitle');
    var text = $('resultText');
    var btn = $('resultBtn');

    if (prize.value > 0) {
      icon.textContent = '🎉';
      title.textContent = 'You Won!';
      title.style.color = 'var(--success)';
      text.innerHTML = 'You have won <b style="color:var(--gold);">' + prize.label + '</b>! Keep spinning to earn more.';
      btn.textContent = 'Awesome!';
      btn.className = 'popup-btn';
    } else {
      icon.textContent = '😅';
      title.textContent = 'Try Again!';
      title.style.color = 'var(--danger)';
      text.innerHTML = 'You missed this time. Better luck next spin!';
      btn.textContent = 'Got it';
      btn.className = 'popup-btn';
      btn.style.background = 'var(--gray)';
    }

    popup.style.display = 'flex';
  }

  function closeResult() {
    $('resultPopup').style.display = 'none';
  }

  function openRecords() {
    $('recordsPopup').style.display = 'flex';
  }

  function closeRecords() {
    $('recordsPopup').style.display = 'none';
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
