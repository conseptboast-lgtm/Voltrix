<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - VOLTRIX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background-color: #F8F9FA; color: #111827; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .register-container { width: 100%; max-width: 400px; background: #FFFFFF; border-radius: 24px; padding: 32px 24px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06); border: 1px solid #E5E7EB; }
  .header { text-align: center; margin-bottom: 24px; }
  .logo { height: 40px; object-fit: contain; margin-bottom: 8px; }
  .title { font-size: 22px; font-weight: 800; color: #111827; }
  .subtitle { font-size: 13px; color: #6B7280; font-weight: 500; }
  .input-group { margin-bottom: 14px; }
  .input-group label { display: block; font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 6px; text-transform: uppercase; }
  .input-group input { width: 100%; padding: 14px 16px; background: #F9FAFB; border: 1.5px solid #E5E7EB; border-radius: 12px; font-size: 15px; font-weight: 600; color: #111827; outline: none; transition: 0.2s; }
  .input-group input:focus { border-color: #2563EB; background: #FFFFFF; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
  .input-group input:read-only { background: #F0FDF4; border-color: #BBF7D0; color: #16A34A; }
  
  .btn-register { width: 100%; padding: 16px; background: #2563EB; color: #FFFFFF; border: none; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); transition: 0.2s; }
  .btn-register:active { transform: scale(0.98); }
  .btn-register:disabled { background: #9CA3AF; cursor: not-allowed; transform: none; box-shadow: none; }
  
  .msg { display: none; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; text-align: center; margin-top: 16px; line-height: 1.5; }
  .msg.error { background: #FEF2F2; color: #DC2626; border: 1px solid #FECACA; display: block; }
  .msg.success { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; display: block; }
  
  .footer-text { text-align: center; font-size: 13px; color: #6B7280; font-weight: 500; margin-top: 20px; }
  .footer-text a { color: #2563EB; font-weight: 700; text-decoration: none; margin-left: 4px; }
</style>
</head>
<body>

<div class="register-container">
  <div class="header">
    <img src="voltrix-logo.png" alt="VOLTRIX" class="logo" onerror="handleImageError(this)">
    <div class="title">Create Account</div>
    <div class="subtitle">Join VOLTRIX today</div>
  </div>

  <form id="registerForm" onsubmit="event.preventDefault(); performRegister();">
    <div class="input-group">
      <label>Full Name</label>
      <input type="text" id="fullNameInput" placeholder="e.g. David Ogbonna" required>
    </div>
    <div class="input-group">
      <label>Phone Number</label>
      <input type="tel" id="phoneInput" placeholder="e.g. 08012345678" required>
    </div>
    <div class="input-group">
      <label>Email Address</label>
      <input type="email" id="emailInput" placeholder="you@example.com" required>
    </div>
    <div class="input-group">
      <label>Referral Code (Optional)</label>
      <input type="text" id="referralInput" placeholder="Enter friend's code">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="Minimum 6 characters" required>
    </div>
    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmInput" placeholder="Re-enter password" required>
    </div>
    
    <button type="submit" class="btn-register" id="registerBtn">Register</button>
    <div id="msg" class="msg"></div>
  </form>

  <div class="footer-text">
    Already have an account? <a href="login.html">Login here</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  function $(id){ return document.getElementById(id); }
  function showMsg(text, type) { var m = $('msg'); m.innerHTML = text; m.className = 'msg ' + type; }
  function handleImageError(img) { img.onerror = null; img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%232563eb" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>'; }

  // Auto-fill referral code from link
  document.addEventListener('DOMContentLoaded', function() {
    var urlParams = new URLSearchParams(window.location.search);
    var refCode = urlParams.get('ref') || urlParams.get('code');
    if (refCode) {
      var refInput = $('referralInput');
      refInput.value = refCode.trim().toUpperCase();
      refInput.readOnly = true;
    }
  });

  async function performRegister() {
    var fullName = $('fullNameInput').value.trim();
    var phoneRaw = $('phoneInput').value.trim();
    var email = $('emailInput').value.trim().toLowerCase();
    var referredBy = $('referralInput').value.trim().toUpperCase();
    var password = $('passwordInput').value;
    var confirm = $('confirmInput').value;
    var btn = $('registerBtn');

    // Validation
    if (!fullName || fullName.split(' ').length < 2) return showMsg('Enter first and last name', 'error');
    if (!/^[0-9]{10,11}$/.test(phoneRaw)) return showMsg('Phone must be 10 or 11 digits', 'error');
    if (!/^\S+@\S+\.\S+$/.test(email)) return showMsg('Enter a valid email', 'error');
    if (password.length < 6) return showMsg('Password must be 6+ characters', 'error');
    if (password !== confirm) return showMsg('Passwords do not match', 'error');

    // Format phone
    var phone = phoneRaw;
    if (/^0\d{10}$/.test(phoneRaw)) phone = '+234' + phoneRaw.substring(1);
    else if (/^\d{10}$/.test(phoneRaw)) phone = '+234' + phoneRaw;

    btn.disabled = true; 
    btn.textContent = 'Creating account...';
    showMsg('Creating your account...', 'success');

    try {
      // 1. Check Phone
      var existing = await dbGetUserRowByPhone(phone);
      if (existing && !existing._queryError) return showMsg('❌ Phone already registered', 'error');
      
      // 2. Check Email
      var { data: emailExists, error: emailErr } = await supabaseClient.from('users').select('id').eq('email', email).limit(1);
      if (emailErr) throw new Error("Database error: " + emailErr.message);
      if (emailExists && emailExists.length > 0) return showMsg('❌ Email already registered', 'error');

      // 3. Check Referral
      var validRef = null;
      if (referredBy) {
        var refUserId = await dbValidateReferralCode(referredBy);
        if (!refUserId) {
          return showMsg('❌ Invalid referral code', 'error');
        }
        validRef = referredBy;
      }

      // 4. Create User
      var result = await dbCreateUser({ 
        fullName: fullName, 
        phone: phone, 
        email: email, 
        password: password, 
        referredBy: validRef, 
        facePhotoUrl: null 
      });

      if (!result || result.error) {
        // Show specific database error if available
        var errDetails = result && result.details ? result.details : 'Registration failed';
        return showMsg('❌ ' + errDetails, 'error');
      }
      
      // 5. Success
      showMsg('✅ Account created! Redirecting to login...', 'success');
      setTimeout(function() { window.location.href = 'login.html'; }, 1500);
      
    } catch (e) {
      console.error(e); 
      // ⭐ SHOW THE ACTUAL ERROR MESSAGE ⭐
      showMsg('❌ Error: ' + (e.message || 'Unknown error occurred'), 'error');
    } finally {
      btn.disabled = false; 
      btn.textContent = 'Register';
    }
  }
</script>
</body>
</html>
